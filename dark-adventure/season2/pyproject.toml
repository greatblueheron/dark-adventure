# Poetry 2.x style (PEP 621 [project] table).
# If you're on Poetry 1.x, either upgrade (`pipx upgrade poetry`) or ask me
# for the classic [tool.poetry] format — 1.x doesn't read [project].

[project]
name = "season2"
version = "0.1.0"
description = "Whispers in Green Static — Season 2 persistent D&D litRPG engine"
requires-python = ">=3.11"
dependencies = [
    "supabase (>=2.0)",
    "anthropic (>=0.40)",
    "pydantic (>=2.0)",
    "python-dotenv (>=1.0)",
]

[tool.poetry]
packages = [{ include = "season2", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
